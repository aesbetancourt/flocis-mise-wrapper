# ~/floci/mise.toml
# Local AWS lab: Floci emulator + Floci UI console + OpenTofu.
# Run `mise tasks` to list everything.

[env]
# Pinned Floci image tags. `mise run upgrade` changes this file.
_.file = "{{config_root}}/versions.env"

# Isolate the lab from ~/.aws — these paths are never your real credentials
AWS_CONFIG_FILE = "{{config_root}}/floci-lab/aws/config"
AWS_SHARED_CREDENTIALS_FILE = "{{config_root}}/floci-lab/aws/credentials"
# Named profile: `--profile floci` fails outside the lab instead of using a real account
AWS_PROFILE = "floci"

# Blank variables the AWS CLI reads before the lab files.
# A real-account session exported in your shell must not reach into the lab.
# `= false` does not remove a variable inherited from the shell. An empty value
# overrides it, and the AWS CLI treats an empty value as not set.
AWS_ACCESS_KEY_ID = ""
AWS_SECRET_ACCESS_KEY = ""
AWS_SESSION_TOKEN = ""
AWS_SECURITY_TOKEN = ""
AWS_ROLE_ARN = ""
AWS_WEB_IDENTITY_TOKEN_FILE = ""
AWS_ENDPOINT_URL = ""
AWS_IGNORE_CONFIGURED_ENDPOINT_URLS = ""

[tools]
# Remove this block if you manage these elsewhere, to avoid a second install.
opentofu = "1.9.0"
# Older awscli macOS packages are x86_64 only and need Rosetta. This one is universal.
awscli = "2.36.45"


# ─── Lifecycle ────────────────────────────────────────────────────────────────

[tasks.install]
description = "Set up the lab from a fresh clone. Run once."
dir = "{{config_root}}"
run = '''
set -e
docker network inspect floci-net >/dev/null 2>&1 || docker network create floci-net
mkdir -p floci-lab/data
docker compose -f floci-lab/docker-compose.yml pull
(cd floci-lab && tofu init -upgrade)

echo ""
echo "Install complete. Run: mise run up"
'''

[tasks.net]
description = "Create the shared Docker network if it is missing"
run = "docker network inspect floci-net >/dev/null 2>&1 || docker network create floci-net"

[tasks.up]
description = "Start the emulator and the web console"
depends = ["net"]
dir = "{{config_root}}"
run = '''
set -e
docker compose -f floci-lab/docker-compose.yml up -d

echo ""
echo "  Console   http://localhost:4500"
echo "  Emulator  http://localhost:4566"
'''

[tasks.down]
description = "Stop the emulator and the console. Keeps data and images."
dir = "{{config_root}}"
run = "docker compose -f floci-lab/docker-compose.yml down --remove-orphans"

[tasks.restart]
description = "Stop and start the lab"
depends = ["down"]
run = "mise run up"


# ─── Inspection ───────────────────────────────────────────────────────────────

[tasks.status]
description = "Show containers on the lab network"
# {% raw %} stops mise's Tera renderer from parsing the Go template braces.
run = "{% raw %}docker ps --filter network=floci-net --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'{% endraw %}"

[tasks.health]
description = "Check that the emulator and the console answer"
run = '''
set -e
emulator=$(curl -fsS http://localhost:4566/_floci/health) || { echo "FAIL emulator :4566" >&2; exit 1; }
version=$(printf '%s' "$emulator" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
echo "OK   emulator             :4566  version $version"

console=$(curl -fsS http://localhost:4500/api/clouds/aws/status) || { echo "FAIL console :4500" >&2; exit 1; }
echo "OK   console              :4500"
case "$console" in
  *'"runtime":"reachable"'*) echo "OK   console → emulator" ;;
  *) echo "FAIL console → emulator: $console" >&2; exit 1 ;;
esac
'''

[tasks.logs]
description = "Follow the emulator logs"
dir = "{{config_root}}"
run = "docker compose -f floci-lab/docker-compose.yml logs -f floci"

[tasks.logs-ui]
description = "Follow the console logs"
dir = "{{config_root}}"
run = "docker compose -f floci-lab/docker-compose.yml logs -f floci-ui"


# ─── Versions ─────────────────────────────────────────────────────────────────
# The logic lives in scripts/versions.sh. Keep it out of this file, because mise
# renders inline `run` strings as Tera templates.

[tasks.outdated]
description = "Compare pinned versions with the latest releases. Changes nothing."
run = "bash {{config_root}}/scripts/versions.sh outdated"

[tasks.upgrade]
description = "Upgrade the Floci pins. Backs up data first and rolls back if health fails."
interactive = true
usage = '''
flag "--floci <version>" help="Upgrade only the emulator, to this version"
flag "--ui <version>" help="Upgrade only the console, to this version"
'''
run = "bash {{config_root}}/scripts/versions.sh upgrade"

[tasks.backup]
description = "Save emulator data and pins to floci-lab/backups"
run = "bash {{config_root}}/scripts/versions.sh backup"

[tasks.rollback]
description = "Restore emulator data and pins from the newest backup"
interactive = true
run = "bash {{config_root}}/scripts/versions.sh rollback"


# ─── Teardown ─────────────────────────────────────────────────────────────────

[tasks.reset]
description = "Stop everything and delete emulator data. Keeps images."
depends = ["down"]
dir = "{{config_root}}"
run = '''
rm -rf floci-lab/data
mkdir -p floci-lab/data
echo "Emulator data deleted. OpenTofu state kept — run 'tofu destroy' first if it matters."
'''

[tasks.flush]
description = "Delete emulator data, backups, and Floci-made containers and volumes. Asks first."
dir = "{{config_root}}"
# mise does not connect stdin to a task unless it is interactive.
interactive = true
run = '''
printf 'This stops the lab and deletes:\n'
printf '  - all emulator data in floci-lab/data\n'
printf '  - all backups in floci-lab/backups\n'
printf '  - the containers and volumes Floci made (Lambda, RDS, ECS, ...)\n'
printf 'Images, version pins, and your .tf files are kept.\n'
printf 'Type "yes" to continue: '
read -r reply
[ "$reply" = "yes" ] || { echo "Cancelled. Nothing changed."; exit 1; }

set -e
docker compose -f floci-lab/docker-compose.yml down --remove-orphans

# Floci labels every container and volume it makes. Other containers on floci-net are not touched.
docker ps -aq --filter label=floci_emulator=floci-aws | xargs -r docker rm -f
docker volume ls -q --filter label=floci_emulator=floci-aws | xargs -r docker volume rm

rm -rf floci-lab/data floci-lab/backups floci-lab/.data-restore
mkdir -p floci-lab/data

echo ""
echo "Flush complete. Run: mise run up"
echo "OpenTofu state files still list the deleted resources. Delete them before the next apply:"
echo "  find floci-lab -name 'terraform.tfstate*' -not -path '*/.terraform/*'"
'''

[tasks.uninstall]
description = "Remove containers, images, network, and data. Keeps backups."
dir = "{{config_root}}"
# mise does not connect stdin to a task unless it is interactive.
interactive = true
run = '''
printf 'This deletes all Floci containers, images, the floci-net network,\n'
printf 'and floci-lab/data. Backups in floci-lab/backups are kept.\n'
printf 'Type "yes" to continue: '
read -r reply
[ "$reply" = "yes" ] || { echo "Cancelled."; exit 1; }

docker compose -f floci-lab/docker-compose.yml down --rmi all -v --remove-orphans || true

# Floci labels every container and volume it makes (Lambda, RDS, ECS). Other containers on floci-net are not touched.
docker ps -aq --filter label=floci_emulator=floci-aws | xargs -r docker rm -f
docker volume ls -q --filter label=floci_emulator=floci-aws | xargs -r docker volume rm
docker network rm floci-net 2>/dev/null || true

rm -rf floci-lab/data
echo ""
echo "Uninstall complete. Your .tf files, mise.toml, backups, and tofu state were kept."
echo "Stale state? Run: rm -f floci-lab/terraform.tfstate*"
'''
